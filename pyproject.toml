# Python dependencies and project config
[project]
name = "ai-news-api"
version = "0.1.0"
description = "AI News API"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
pythonpath = ["."]
